name: CleanCache Pro Auto Build & Release APK

on:
  push:
    tags:
      - 'v*' # Memicu otomatisasi setiap kali Anda membuat Tag seperti v1.1.0, v1.2.0

jobs:
  build-and-release:
    name: Build & Publish GitHub Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CleanCachePro-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: CleanCache Pro ${{ github.ref_name }}
          body: |
            ## 🎉 CleanCache Pro Pembaruan Otomatis ${{ github.ref_name }}
            
            Pembaruan rilis resmi untuk CleanCache Pro.
            - Peningkatan kecepatan pemindaian cache aplikasi
            - Pembersihan file temporary dan thumbnail media
            - Optimalisasi performa dan stabilitas Material 3
          files: |
            CleanCachePro-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
