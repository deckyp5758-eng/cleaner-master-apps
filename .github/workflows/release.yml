name: CleanCache Pro Auto Build & Release APK

on:
  workflow_dispatch: # Memungkinkan pemicuan manual dari halaman GitHub Actions
  push:
    tags:
      - 'v*' # Memicu otomatisasi setiap kali Anda membuat Tag seperti v1.0.0, v1.1.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease -x test --no-daemon
          else
            gradle assembleRelease -x test --no-daemon
          fi

      - name: Prepare APK File
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ] || [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -n "$VERSION_NAME" ]; then
              TAG_NAME="v$VERSION_NAME"
            else
              TAG_NAME="v1.1.0"
            fi
          fi
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "CleanCachePro-${TAG_NAME}.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "CleanCachePro-${TAG_NAME}.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "CleanCachePro-${TAG_NAME}.apk"
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} "CleanCachePro-${TAG_NAME}.apk" \;
          fi
          
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV

      - name: Check if Release Already Exists
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
            echo "Release ${{ env.RELEASE_TAG }} already exists. Skipping upload to prevent immutable release errors."
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload APK
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CleanCache Pro ${{ env.RELEASE_TAG }}
          body: |
            ## 🎉 CleanCache Pro Pembaruan Otomatis ${{ env.RELEASE_TAG }}
            
            Pembaruan rilis resmi untuk CleanCache Pro (Release APK).
            - Pembersihan cache aplikasi dan file sampah sistem
            - Pembersihan file besar dan media sosial
            - Optimalisasi performa dan pembaruan Material 3 UI
          files: |
            CleanCachePro-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
